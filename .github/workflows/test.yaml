name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - tp3
  pull_request:
    branches:
      - main
      - tp3

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16' 

      - name: Install dependencies
        run: npm install

      - name: Run functional tests
        run: npm test

      - name: Run security checks
        run: npm audit --audit-level=high
